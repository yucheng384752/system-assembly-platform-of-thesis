services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: &backend-build
      context: ..
      dockerfile: deployment/backend.Dockerfile
    environment: &backend-environment
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENTRY_PERMISSION_JWT_SECRET: ${ENTRY_PERMISSION_JWT_SECRET:?ENTRY_PERMISSION_JWT_SECRET is required}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID is required}
      SYSTEM_ID: ${SYSTEM_ID:?SYSTEM_ID is required}
@@WEBHOOK_ENV@@      ENVIRONMENT: production
      AUTH_MODE: api_key
      USE_GENERIC_SCHEMA: "true"
      UPLOAD_TEMP_DIR: /system/data/uploads
      LOG_DIR: /system/data/logs
      ENDPOINT_PERMISSIONS_FILE: /system/permissions/endpoint_permissions.json
    expose: ["8000"]
    volumes: &backend-volumes
      - files:/system/data
      - permissions:/system/permissions
    networks: [data, edge]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
  init:
    profiles: ["init"]
    build: *backend-build
    environment: *backend-environment
    volumes: *backend-volumes
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.system_init"]
    restart: "no"
  proxy:
    image: nginx:1.28.0-bookworm
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    depends_on: [backend]
networks:
  data:
    internal: true
  edge: {}
volumes:
  database:
  files:
  permissions:
